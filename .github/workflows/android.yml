name: Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build release bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-android-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-android-release-bundle
          path: mobile/app/build/outputs/bundle/release/app-release.aab
