name: calculator-share-preview
on:
  push:
    branches:
      - astra/calculator-reference-v2

permissions:
  contents: read
  pull-requests: write

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start local preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..20}; do
            if curl -sfI http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1
      - name: Start temporary public tunnel
        id: tunnel
        run: |
          nohup npx wrangler tunnel quick-start http://127.0.0.1:4173 > /tmp/tunnel.log 2>&1 &
          for i in {1..40}; do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Preview URL: $URL?designPreview=1"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tunnel.log
          exit 1
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: gh pr comment 3 --body "🔎 Calculator preview: ${PREVIEW_URL}?designPreview=1"
      - name: Keep preview alive
        run: sleep 3000
